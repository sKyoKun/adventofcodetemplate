parameters:
    env(AOC_YEAR): '2024'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Tests\Behat\:
        resource: '../tests/Behat/*'

    App\Tests\HttpClient\:
        resource: '../tests/HttpClient/*'

    # No real cookie file nor real leaderboards in tests: the Advent of Code API is mocked
    # by App\Tests\HttpClient\AocApiMockResponseFactory (see config/packages/framework.yaml)
    App\Service\Leaderboard\AocLeaderboardClient:
        arguments:
            $sessionCookie: 'test-session-cookie'

    App\Service\Leaderboard\LeaderboardBuilder:
        arguments:
            $leaderboards:
                - { name: 'My friends', id: 1 }
                - { name: 'WA Lyon', id: 2, group: 'WA' }
                - { name: 'WA Paris', id: 3, group: 'WA' }
